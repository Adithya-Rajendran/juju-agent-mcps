[project]
name = "juju-agent-mcps"
version = "0.0.1"
description = "MCP servers (juju-ops, juju-docs, cos-metrics) that let LLM agents operate Juju models within policy guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Adithya Rajendran" }]

dependencies = [
    # 1.24 adds mcp.client.streamable_http.streamable_http_client, used by
    # eval/auto/mcp_client.py; the servers need FastMCP's streamable-http.
    "mcp>=1.24,<3",
    "httpx>=0.27,<1",
    "pyyaml>=6.0,<7",
    "juju>=3.5,<4",
    # juju_debug_log uses the asyncio client (`additional_headers=`), which
    # became the top-level websockets.connect in 14.0.
    "websockets>=14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.6",
    "trustme>=1.1",
]

[project.urls]
Repository = "https://github.com/Adithya-Rajendran/juju-agent-mcps"
Issues = "https://github.com/Adithya-Rajendran/juju-agent-mcps/issues"

[project.scripts]
juju-docs-mcp = "juju_docs.server:main"
juju-ops-mcp = "juju_ops.server:main"
cos-metrics-mcp = "cos_metrics.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["juju_docs", "juju_ops", "cos_metrics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage is reported by default but the fail-under floor is enforced only
# in CI (so partial local runs aren't blocked). See .github/workflows/ci.yml.
addopts = [
    "--cov=juju_docs",
    "--cov=juju_ops",
    "--cov=cos_metrics",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E,F: pyflakes/pycodestyle. I: import order. UP: modern syntax.
# B: bugbear (mutable defaults, etc.). SIM: simplifications.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # E501: line-too-long is enforced by the formatter; don't double-fire on
    # comments, docstrings, and long string literals.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests freely use bare assertions and longer fixtures; fewer rules apply.
"tests/*" = ["B011", "SIM117"]
