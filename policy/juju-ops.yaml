# juju-ops policy — bounds + allowlists per application.
#
# Loaded once at server startup. The LLM never sees this file; it only sees
# the tool's effects (e.g. "config key 'foo' is not in the allowlist for
# 'postgresql' (allowed: [...])"). All bounds are enforced server-side in
# juju_ops/policy.py. juju_resolved, juju_config_set, juju_add_unit and
# juju_remove_unit refuse applications not listed below; the provisioning
# tools (juju_deploy, juju_integrate, juju_add_model) do not consult this
# list and rely on mutations.force_dry_run instead.

schema_version: 1

default_model: sandbox

allowed_models:
  - sandbox

applications:
  postgresql:
    config_allowlist:
      - max_connections
      - log_min_duration_statement
      - shared_buffers
      - work_mem
    min_units: 3
    max_units: 7

  api:
    config_allowlist:
      - workers
      - log_level
      - timeout_s
      - feature_flags
    min_units: 1
    max_units: 6

  grafana-agent:
    config_allowlist:
      - tls_enabled
      - extra_alerts
    min_units: 0
    max_units: 0

mutations:
  # Tools listed here always return a dry-run plan, whatever the caller
  # passes as dry_run. Provisioning (deploy, add_model, integrate) and
  # config changes stay plan-only until an operator removes them from the
  # list. Scale tools (juju_add_unit, juju_remove_unit) are not listed:
  # min_units / max_units above are their hard bound, and a request
  # outside it gets a structured refusal.
  force_dry_run:
    - juju_deploy
    - juju_add_model
    - juju_integrate
    - juju_config_set
