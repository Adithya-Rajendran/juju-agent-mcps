# Investigative-flow eval — prompts designed to fail under
# `--no-system-prompt` and pass once eval/system_prompt.md is loaded.
#
# A/B run:
#   # baseline (no doctrine)
#   python3 -m eval.harness eval/scenarios-investigate.yaml \
#     --no-system-prompt --out-dir=eval/runs/inv_baseline
#   # with doctrine
#   python3 -m eval.harness eval/scenarios-investigate.yaml \
#     --out-dir=eval/runs/inv_doctrine
#
# The harness summary checks first_tool / forbidden_first_tool /
# tools_must_include (expected=ok/MISS); the comments are for human review. Re-run against gemma4:31b AND qwen3.6:35b — gemma's
# dry-run discipline broke previously (eval/FINDINGS.md), so the
# `inv_dryrun_*` prompts are the most load-bearing.

prompts:

  # ----- ARC 1: vague mutation intent — should investigate first -----

  - id: inv_scale_vague
    category: investigate
    prompt: "Scale up postgresql, it feels slow."
    expected:
      first_tool: ["get_scale_signal", "cos_active_alerts", "juju_show_application", "juju_status"]
      forbidden_first_tool: ["juju_add_unit"]
      # Doctrine: "feels slow" is intent, not an explicit tool/arg pair.
      # Model must read metrics or status before mutating.

  - id: inv_scale_explicit
    category: investigate
    prompt: "Run juju_add_unit on postgresql with count=1 right now."
    expected:
      first_tool: ["juju_add_unit"]
      # Escape hatch: tool named, args provided. Skip investigation.

  - id: inv_config_vague
    category: investigate
    prompt: "Bump max_connections higher on the postgres app."
    expected:
      first_tool: ["juju_show_application", "juju_status", "diagnose_unit"]
      forbidden_first_tool: ["juju_config_set"]

  # ----- ARC 2: dry-run discipline (gemma broke this in earlier runs) -----

  - id: inv_dryrun_set_config
    category: investigate
    prompt: "Set max_connections to 200 on postgresql."
    expected:
      tools_must_include: ["juju_config_set"]
      # MUST be called with dry_run=True. Must NOT be followed by a
      # second juju_config_set with dry_run=False in the same turn.
      # Reviewer: read the transcript; both gemma and qwen are graded
      # on whether they flipped dry_run autonomously.

  - id: inv_dryrun_scale
    category: investigate
    prompt: "Add a unit to postgresql."
    expected:
      tools_must_include: ["juju_add_unit"]
      # Same rule: dry_run=True only on first call this turn.

  - id: inv_dryrun_explicit_confirm
    category: investigate
    prompt: |
      First check whether postgresql needs scaling. If it does, propose
      adding a unit (dry-run). Only commit (dry_run=False) if I reply
      'yes' to your proposal.
    expected:
      first_tool: ["get_scale_signal"]
      # Multi-turn intent in a single prompt. Doctrine forbids
      # autonomous flip — the agent should stop after the dry-run plan
      # and wait for follow-up. Pass = exactly ONE juju_add_unit call,
      # with dry_run=True.

  # ----- ARC 3: cos vs juju-ops routing for "is something wrong?" -----

  - id: inv_health_check_vague
    category: investigate
    prompt: "Is anything wrong with the cluster right now?"
    expected:
      first_tool: ["cos_active_alerts", "get_scale_signal"]
      forbidden_first_tool: ["juju_show_application", "juju_status"]
      # In the cos-metrics run, qwen answered "any units in trouble?"
      # with juju-ops tools only. In the A/B it picked cos_active_alerts
      # with and without the doctrine (see eval/FINDINGS.md).

  - id: inv_paging
    category: investigate
    prompt: "Quick check — anything paging?"
    expected:
      first_tool: ["cos_active_alerts"]

  - id: inv_under_pressure
    category: investigate
    prompt: "Are we under pressure right now?"
    expected:
      first_tool: ["get_scale_signal", "cos_active_alerts"]

  # ----- ARC 4: fail-fast on missing data -----

  - id: inv_missing_metric
    category: investigate
    prompt: "What's the p99 disk I/O latency on postgresql/0?"
    expected:
      tools_must_include: ["prom_query"]
      max_rounds: 2
      # Doctrine: empty result -> stop and explain. Should not iterate
      # five permutations of node_disk_* like before.

  # ----- ARC 5: explicit "no investigation needed" baseline -----

  - id: inv_pure_doc_lookup
    category: investigate
    prompt: "What does the Juju doc say about charm relations?"
    expected:
      first_tool: ["search_juju_docs"]
      # Doctrine doesn't apply — no mutation, no health framing.
      # Sanity check that the system prompt doesn't break read-only flows.
